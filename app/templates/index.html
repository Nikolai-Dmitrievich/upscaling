<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Upscaler</title>
</head>
<body>
    <h1>Image Upscaling</h1>

    <form method="post" action="/upscale" enctype="multipart/form-data">
        <label for="image">Select image:</label><br>
        <input type="file" name="image" accept="image/*" required>
        <br><br>

        <label>
            <input type="radio" name="model" value="opencv" checked> OpenCV (x2)
        </label>
        <br>
        <label>
            <input type="radio" name="model" value="edsr"> EDSR (x2)
        </label>
        <br><br>

        <button type="submit">Upload</button>
    </form>
</body>
</html>
